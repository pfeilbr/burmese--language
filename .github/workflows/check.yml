name: Check

# Catches a broken phrase list or a syntax error before it reaches the deploy.
# The deploy itself only runs on the default branch, so without this a pull
# request gets no checks at all.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # Syllable alignment, ids, categories and starter numbering. No network
      # calls to the TTS service: --check stops before rendering.
      - name: Validate phrases
        run: uv run --with edge-tts --with miniaudio scripts/build.py --check

      # The generated data must match the source, or the site ships phrases
      # that data/phrases.json no longer describes.
      - name: Generated data is up to date
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          src = json.loads(pathlib.Path("data/phrases.json").read_text())
          js = pathlib.Path("web/data/phrases.js").read_text()
          out = json.loads(js[js.index("{"):js.rindex("}") + 1])
          want = [p["id"] for p in src["phrases"]]
          have = [p["id"] for p in out["phrases"]]
          if want != have:
              sys.exit(f"web/data/phrases.js is stale: run ./scripts/build.py\n"
                       f"missing: {sorted(set(want) - set(have))}\n"
                       f"extra:   {sorted(set(have) - set(want))}")
          audio = pathlib.Path("web/audio")
          missing = [f"{i}.{t}.mp3" for i in want for t in src["tracks"]
                     if not (audio / f"{i}.{t}.mp3").exists()]
          if missing:
              sys.exit(f"missing audio: {missing[:10]}")
          print(f"OK: {len(want)} phrases, audio present")
          EOF

      - name: JavaScript parses
        run: |
          node --check web/app.js
          node --check web/sw.js
