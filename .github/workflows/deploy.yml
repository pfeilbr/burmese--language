name: Deploy to GitHub Pages

# Deploys whatever is on the repository's default branch, rather than naming
# a branch here. Naming one means the workflow silently stops deploying the
# day the default branch is renamed, and the failure mode is a site that just
# quietly stops updating.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Pages itself has to be switched on by hand once, under
      # Settings -> Pages -> Source: GitHub Actions. The `enablement: true`
      # input here would do it, but only with a workflow token allowed to
      # administer the repository, which the default one is not.
      - uses: actions/configure-pages@v5

      # The browser decides an update exists by byte-comparing sw.js, so it has
      # to differ between deploys or no update is ever detected. Stamping the
      # commit SHA guarantees that, and gives the app a version to display.
      - name: Stamp build id
        run: |
          BUILD="$(git rev-parse --short HEAD)"
          sed -i "s/__BUILD__/${BUILD}/g" web/sw.js web/index.html
          echo "Stamped build ${BUILD}"
          grep -n "${BUILD}" web/sw.js web/index.html

      # The site is fully static and pre-built; `web/` is published as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
